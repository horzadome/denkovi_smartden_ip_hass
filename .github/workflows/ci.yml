---
name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/python@v10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEGALINTER_CONFIG: .mega-linter.yml
          APPLY_FIXES: none

  hassfest:
    name: Hassfest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
